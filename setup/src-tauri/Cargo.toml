[package]
name = "fivepm-setup"
version = "1.0.0"
description = "5pm Setup: branded installer that runs the signed NSIS installer silently"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
