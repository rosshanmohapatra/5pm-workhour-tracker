    <style>
      /* ── Sign in (#8, approved 2026-11-15) ──
         Built from uiarc's login-centered block + Button, Input, PasswordField,
         OtpInput and Alert (spacing, radii, type scale, motion tokens), on 5pm's
         cool graphite colours. Dark is the base; data-theme="light" swaps it. */
      :root {

        --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.125rem; --space-6:1.25rem; --space-8:1.5rem; --space-10:2rem;

        --control-height-sm:2rem; --control-height-md:2.5rem; --control-height-lg:2.75rem;
        --font-display:"Geist", "Inter", system-ui, sans-serif; --font-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --text-xs:.75rem; --text-sm:.8125rem; --text-base:.9375rem; --text-lg:1.0625rem; --text-2xl:1.375rem; --text-3xl:1.75rem; --text-field:.875rem;
        --tracking-display:-.03em; --tracking-body:-.01em; --leading-display:1.1; --leading-body:1.4;
        --ease-enter:cubic-bezier(.16,1,.3,1); --ease-standard:cubic-bezier(.22,1,.36,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
        --duration-instant:100ms; --duration-fast:150ms; --duration-exit:140ms; --duration-standard:200ms; --duration-smooth:320ms; --duration-considered:360ms;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --background:#eef0f4; --surface:#ffffff; --surface-muted:#f6f7fa; --foreground:#0c0e13; --text-secondary:#545b69; --text-muted:#747c8a;
        --border:#dde1e8; --border-subtle:#e7eaf0; --border-strong:#c3c8d2; --accent:#0c0e13; --accent-subtle:rgb(12 14 19 / .06);
        --danger:#c42b33; --success:#00774d; --warning:#9f6202; --info:#2f6f9f;
        --shadow-resting:0 1px 2px rgb(0 0 0 / .035); --shadow-floating:0 20px 48px rgb(0 0 0 / .105);
        color-scheme: light;

      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }

      }
      :root[data-theme="light"] {
        --background:#eef0f4; --surface:#ffffff; --surface-muted:#f6f7fa; --foreground:#0c0e13; --text-secondary:#545b69; --text-muted:#747c8a;
        --border:#dde1e8; --border-subtle:#e7eaf0; --border-strong:#c3c8d2; --accent:#0c0e13; --accent-subtle:rgb(12 14 19 / .06);
        --danger:#c42b33; --success:#00774d; --warning:#9f6202; --info:#2f6f9f;
        --shadow-resting:0 1px 2px rgb(0 0 0 / .035); --shadow-floating:0 20px 48px rgb(0 0 0 / .105);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; }

        -webkit-font-smoothing: antialiased; }
      button { font: inherit; letter-spacing: inherit; color: inherit; }
      /* The page: top bar with the 5pm mark, the centred card, Privacy / About at the foot. */
      .screen { --bar: 64px; container: login / inline-size; position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--bar) minmax(0, 1fr) var(--bar); min-height: 100vh; min-height: 100dvh; overflow-x: hidden; background: var(--background);
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
      .backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; -webkit-mask-image: radial-gradient(ellipse 72% 78% at 50% 50%, #000 38%, transparent 100%); mask-image: radial-gradient(ellipse 72% 78% at 50% 50%, #000 38%, transparent 100%); }

      .mark { display: block; width: 28px; height: 28px; border-radius: 8px; }
      .mark.l { display: none; } :root[data-theme="light"] .mark.d { display: none; } :root[data-theme="light"] .mark.l { display: block; }
      .stage { display: grid; place-items: center; align-content: center; gap: var(--space-4); padding: var(--space-6) var(--space-4); min-width: 0; }
      .card { width: min(100%, 420px); min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-surface); background: var(--surface); box-shadow: var(--shadow-resting); }
      .viewport { position: relative; overflow: hidden; }
      .step { display: grid; min-width: 0; padding: var(--space-8); }
      .step.leaving { position: absolute; inset: 0 0 auto 0; pointer-events: none; opacity: 0; transform: translateY(calc(var(--dir, 1) * -8px)); filter: blur(4px); transition: opacity var(--duration-exit) var(--ease-standard), transform var(--duration-exit) var(--ease-standard), filter var(--duration-exit) var(--ease-standard); }

      .heading p { margin: 0; color: var(--text-secondary); font-size: var(--text-sm); text-wrap: pretty; }
      .address { color: var(--foreground); overflow-wrap: anywhere; }
      .top { display: flex; align-items: center; justify-content: space-between; margin: calc(var(--space-2) * -1) 0 var(--space-4) calc(var(--space-3) * -1); }
      .icon48 { width: 48px; height: 48px; margin-bottom: var(--space-6); color: var(--foreground); }
      .icon48.ok { color: var(--success); }
      .icon48 circle.draw, .icon48 path.draw { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw var(--duration-considered) var(--ease-in-out) .16s forwards; }
      .icon48 path.draw { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .28s var(--ease-enter) .52s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .icon48 .spinR { transform-origin: 24px 24px; animation: spin 1s linear infinite; }

      .actions, .form { display: grid; gap: var(--space-3); }
      .form { gap: var(--space-4); }
      .divider { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-5) 0; color: var(--text-muted); font-size: var(--text-xs); line-height: 1; }
      .divider::before, .divider::after { flex: 1; height: 1px; background: var(--border); content: ""; }

      /* Button (uiarc) */
      .btn { position: relative; display: inline-flex; width: 100%; min-height: var(--control-height-md); align-items: center; justify-content: center; gap: var(--space-2); border: 1px solid transparent; border-radius: var(--radius-control); padding: 0 var(--space-4); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
        transition: color var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), opacity var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard); }
      .btn:active:not([aria-disabled="true"]) { transform: scale(.98); }
      .btn.lg { min-height: var(--control-height-lg); border-radius: calc(var(--radius-control) + 2px); }
      .btn.primary { color: var(--background); background: var(--foreground); border-color: var(--foreground); }
      .btn.secondary { color: var(--foreground); background: var(--surface); border-color: var(--border); }
      .btn.ghost { color: var(--text-secondary); background: transparent; width: auto; }
      .btn[aria-disabled="true"] { cursor: not-allowed; }
      .btn.primary[aria-disabled="true"]:not([aria-busy="true"]) { opacity: 1; color: var(--text-muted); background: var(--surface-muted); border-color: var(--border); }
      .btn[aria-busy="true"] { cursor: progress; }
      @media (hover: hover) and (pointer: fine) {
        .btn.primary:hover:not([aria-disabled="true"]) { opacity: .91; box-shadow: var(--shadow-resting); }
        .btn.secondary:hover:not([aria-disabled="true"]) { background: var(--surface-muted); box-shadow: var(--shadow-resting); }
        .btn.ghost:hover { color: var(--foreground); background: var(--surface-muted); }
      }
      .btn svg { width: 16px; height: 16px; flex: none; }
      .lbl { display: inline-flex; align-items: center; gap: var(--space-2); transition: opacity var(--duration-fast) var(--ease-standard); }
      .btn[aria-busy="true"] > .lbl { opacity: 0; }
      .btn > .spin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; opacity: 0; transition: opacity var(--duration-fast); }
      .btn[aria-busy="true"] > .spin { opacity: 1; }
      .btn.busyText[aria-busy="true"] > .lbl { opacity: 1; padding-left: 24px; } .btn.busyText[aria-busy="true"] > .spin { left: auto; margin: -8px 0 0; position: relative; top: 0; order: -1; display: none; }
      .lbl .spinIn { width: 14px; height: 14px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .swapIn { animation: swapIn var(--duration-standard) var(--ease-enter); }
      @keyframes swapIn { from { opacity: 0; transform: translateY(.3em); filter: blur(4px); } }
      /* "Last used": one placement everywhere, inside the button at its right end. */
      .tag { position: absolute; right: 12px; top: 0; transform: translateY(-50%); height: 20px; z-index: 1; display: inline-flex; align-items: center; padding: 0 8px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: 500; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border-strong); pointer-events: none; box-shadow: var(--shadow-resting); }

      .actions, .form { padding-top: 2px; }
      .actions:has(.tag) { gap: var(--space-5); } .form .btn:has(.tag) { margin-top: var(--space-1); }

      .textButton { position: relative; display: inline-flex; min-height: var(--control-height-sm); align-items: center; justify-self: center; gap: var(--space-2); margin: var(--space-4) 0 calc(var(--space-2) * -1); border: 0; border-radius: var(--radius-pill); padding: 0 var(--space-3); background: none; color: var(--text-secondary); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard); }
      .textButton svg { width: 16px; height: 16px; flex: none; }
      .textButton { white-space: nowrap; }

      .back { display: inline-flex; align-items: center; gap: 4px; min-height: var(--control-height-sm); border: 0; border-radius: var(--radius-pill); padding: 0 var(--space-3) 0 var(--space-2); background: none; color: var(--text-secondary); font-size: var(--text-sm); font-weight: 500; cursor: pointer; transition: color var(--duration-fast), background-color var(--duration-fast); }
      .back svg { width: 16px; height: 16px; }
      @media (hover: hover) and (pointer: fine) { .textButton:not([aria-disabled="true"]):hover, .back:hover { color: var(--foreground); background: var(--surface-muted); } .inlineButton:hover { text-decoration-color: currentColor; } }
      .note { margin: var(--space-4) 0 0; text-align: center; color: var(--text-muted); font-size: var(--text-xs); text-wrap: pretty; }

      /* Input + PasswordField (uiarc): no ring, the border answers. The message row is a clipped slot that grows from a true zero. */
      .field { display: grid; min-width: 0; }
      .labelRow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
      .label { color: var(--foreground); font-size: var(--text-sm); font-weight: 500; }

      .input, .shell { width: 100%; min-height: var(--control-height-md); border: 1px solid var(--border-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--foreground); font-size: var(--text-field); transition: border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard); }
      .input { padding: 0 var(--space-3); font: inherit; font-size: var(--text-field); outline: none; }

      @media (hover: hover) and (pointer: fine) { .input:hover:not([aria-invalid="true"]), .shell:hover:not(:focus-within):not([data-invalid="true"]) { border-color: var(--foreground); } }

      .slot.open { grid-template-rows: 1fr; opacity: 1; }
      .msg { display: block; padding-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); }
      .msg.err { color: var(--danger); }
      .msg > span, .al-copy > * { display: block; }
      .slot.open .msg > span { animation: swapIn var(--duration-standard) var(--ease-enter); }

      /* Autofill list drawn by the browser (passkey). */
      .fieldWrap { position: relative; }
      .autofill { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-floating); overflow: hidden; transform-origin: top; animation: pop var(--duration-standard) var(--ease-enter); }

      /* OtpInput (uiarc): one ring glides to the focused slot. */
      .otp { position: relative; display: flex; gap: 8px; width: fit-content; max-width: 100%; }
      .otp .cell { position: relative; width: 42px; height: 48px; flex: 0 1 42px; }

      .below { color: var(--text-secondary); font-size: var(--text-sm); text-align: center; }

      .legal a { display: inline-flex; min-height: 32px; align-items: center; border-radius: var(--radius-pill); padding: 0 var(--space-2); color: var(--text-secondary); text-decoration: none; }
      .legal a:hover { color: var(--foreground); background: var(--surface-muted); }
      .slowLine { margin: 0; padding: 2px 2px 4px; color: var(--text-secondary); font-size: var(--text-sm); }
      .rule { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); transition: color var(--duration-fast) var(--ease-standard); }
      .rule svg { width: 14px; height: 14px; flex: none; }
      .rule .rk { stroke-dasharray: 10; stroke-dashoffset: 10; transition: stroke-dashoffset var(--duration-standard) var(--ease-enter); }
      .rule .rc { transition: stroke var(--duration-fast); }
      .rule[data-state="ok"] { color: var(--success); } .rule[data-state="ok"] .rk { stroke-dashoffset: 0; }
      .rule[data-state="short"] { color: var(--danger); }
      .caps { display: inline-flex; align-items: center; gap: 6px; } .caps svg { width: 14px; height: 14px; }
      /* Backup codes: numbered, two columns, fixed-width so each one is easy to copy by eye. */
      .codes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin: 0; padding: var(--space-4) var(--space-5); list-style: none; counter-reset: c; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface-muted); font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; font-size: var(--text-field); letter-spacing: .04em; }
      .codes li { counter-increment: c; display: flex; gap: 10px; align-items: baseline; }
      .codes li::before { content: counter(c); width: 1.4em; text-align: right; color: var(--text-muted); font-size: var(--text-xs); }
      .codes li.used { color: var(--text-muted); text-decoration: line-through; }
      .codeTools { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-3); }
      .btn.sm { width: auto; min-height: var(--control-height-sm); border-radius: calc(var(--radius-control) - 2px); padding: 0 var(--space-3); }
      .btn.danger { color: #fff; background: #d2373d; border-color: #d2373d; }
      :root[data-theme="light"] .btn.danger { background: #c42b33; border-color: #c42b33; }
      @media (hover: hover) and (pointer: fine) { .btn.danger:hover:not([aria-disabled="true"]) { background: #c9323a; border-color: #c9323a; opacity: 1; } :root[data-theme="light"] .btn.danger:hover { background: #b4232b; border-color: #b4232b; } }
      .btn.danger:active { background: #b4232b; }
      /* Checkbox (uiarc): the square alone reacts to a press; the tick draws itself. */
      .check { display: flex; align-items: flex-start; gap: var(--space-3); margin-top: var(--space-3); cursor: pointer; font-size: var(--text-sm); font-weight: 500; color: var(--foreground); }
      .check input { position: absolute; opacity: 0; pointer-events: none; }
      .check .visual { position: relative; flex: none; width: 18px; height: 18px; margin-top: 1px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface); color: var(--background); transition: border-color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard); }
      .check .visual i { position: absolute; inset: -1px; border-radius: inherit; background: var(--foreground); transform: scale(.6); opacity: 0; transition: transform var(--duration-standard) var(--ease-standard), opacity var(--duration-fast); }
      .check .visual svg { position: absolute; inset: -1px; width: 18px; height: 18px; }
      .check .visual path { stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset var(--duration-standard) var(--ease-enter) 40ms; }
      .check input:checked + .visual { border-color: var(--foreground); }
      .check input:checked + .visual i { transform: scale(1); opacity: 1; }
      .check input:checked + .visual path { stroke-dashoffset: 0; }
      .check:active .visual { transform: scale(.95); }
      .check input:focus-visible + .visual { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground); }
      @media (hover: hover) and (pointer: fine) { .check:hover input:not(:checked) + .visual { border-color: var(--text-muted); } }
      .alert.inline { margin: var(--space-5) 0 0; }
      .alert .check { margin-top: var(--space-3); }
      .tip { position: absolute; z-index: 20; bottom: calc(100% + 8px); left: 50%; translate: -50% 0; padding: var(--space-2) var(--space-3); border: 1px solid color-mix(in srgb, var(--background) 14%, var(--foreground)); border-radius: var(--radius-control); background: var(--foreground); color: var(--background); box-shadow: 0 8px 22px rgb(0 0 0 / .22); font-size: var(--text-sm); font-weight: 400; white-space: nowrap; pointer-events: none;
        opacity: 0; transform: translateY(3px) scale(.97); transition: opacity var(--duration-fast) var(--ease-enter), transform var(--duration-fast) var(--ease-enter); }
      .tip.on { opacity: 1; transform: none; }
      .tip.off { opacity: 0; transform: scale(.98); transition-duration: var(--duration-instant); }
      /* Only the glyph takes the success colour; the label stays put (uiarc copy-button). */
      .btn .ok-glyph { color: var(--success); }
      .btn .ok-glyph path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw var(--duration-standard) var(--ease-standard) 60ms forwards; }
      .btn .ext { width: 14px; height: 14px; color: var(--text-muted); margin-left: 2px; }
      .nf { margin: 0 0 var(--space-2); font-family: var(--font-display); font-size: 4rem; font-weight: 400; letter-spacing: -.04em; line-height: 1; color: var(--text-muted); }

      @container login (max-width: 520px) { .bar, .foot { padding-inline: var(--space-4); } .stage { padding: var(--space-4); } .card { border-radius: var(--radius-panel); } .step { padding: var(--space-6); } }
      @container login (max-width: 400px) { .stage { padding-inline: var(--space-3); } .step { padding-inline: var(--space-5); } .heading h2 { font-size: var(--text-2xl); } }
      :focus-visible { outline: none; }
      .btn:focus-visible, .textButton:focus-visible, .inlineButton:focus-visible, .back:focus-visible, .eye:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }

      .legal a { font-size: var(--text-xs); }
      .boot { display: grid; place-items: center; min-height: 160px; }
      .boot .spinIn { width: 20px; height: 20px; border: 1.5px solid var(--text-muted); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    </style>
  </head>
  <body>
    <main class="screen" aria-label="Sign in to 5pm">
      <div class="backdrop" aria-hidden="true">
        <svg viewBox="-600 -400 1200 800" preserveAspectRatio="xMidYMid slice">
          <line x1="-600" y1="0" x2="600" y2="0" />
          <line x1="0" y1="-400" x2="0" y2="400" />
          <circle r="140" />
          <circle r="230" class="major" />
          <circle r="330" />
          <circle r="440" />
          <circle r="560" class="major" />
        </svg>
      </div>
      <header class="bar">
        <img class="mark d" alt="5pm" src="/icons/brand-dark.svg" /><img
          class="mark l"
          alt="5pm"
          src="/icons/brand-light.svg"
        />
      </header>
      <div class="stage">
        <div class="card">
          <div class="viewport" id="vp" aria-live="polite">
            <div class="step boot"><span class="spinIn" aria-label="Loading"></span></div>
          </div>
        </div>
        <div class="below" id="below" hidden></div>
      </div>
      <footer class="foot">
        <nav class="legal" aria-label="Legal"><a href="/privacy.html">Privacy</a><a href="/about.html">About</a></nav>
      </footer>
    </main>
    <script src="login.js"></script>
  </body>
</html>
