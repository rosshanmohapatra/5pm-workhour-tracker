<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>5pm — Signing in…</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f5f5f7;
      --fg:      #09090b;
      --muted-fg:#71717a;
      --font:    'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .dark {
      --bg:      #09090b;
      --fg:      #fafafa;
      --muted-fg:#a1a1aa;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(113,113,122,.2);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .msg  { font-size: 15px; color: var(--muted-fg); }
    .err  { font-size: 14px; color: #dc2626; text-align: center; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg"     id="msg">Completing sign-in…</div>

  <!-- Single source of truth for Supabase credentials (sets window.__SB_URL / __SB_ANON_KEY) -->
  <script src="/lib/config.js"></script>
  <script src="/lib/pages/oauth-consent-inline.js"></script>
</body>
</html>
