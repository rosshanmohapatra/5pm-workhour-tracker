name: Desktop release

# Tag a commit on the desktop branch to build it:
#   git tag v1.2.1 && git push origin v1.2.1
# The release is created as a DRAFT. Nothing reaches users until it is published
# by hand in the GitHub UI.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Pinned: src-tauri/installer/installer.nsi is a copy of this CLI's template.
          # Bump both together (re-copy the stock template and re-apply the "5pm:" edits).
          tauriScript: npx --yes @tauri-apps/cli@2.12.0
          tagName: ${{ github.ref_name }}
          releaseName: '5pm ${{ github.ref_name }}'
          # Left empty on purpose. The app's "release notes" link opens this
          # release page, so write the notes in the draft before publishing.
          # GitHub's "Generate release notes" button fills it from the commits.
          releaseDraft: true
          includeUpdaterJson: true

      # 5pm Setup: the branded installer people download. It carries the NSIS
      # installer built above and runs it silently. The NSIS installer stays in
      # the release too, because latest.json (the in-app updater) points at it.
      - name: Build 5pm Setup
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/src-tauri/target"
          export FIVEPM_INSTALLER="$CARGO_TARGET_DIR/release/bundle/nsis/5pm_${VER}_x64-setup.exe"
          export FIVEPM_APP_EXE_SIZE="$(stat -c %s "$CARGO_TARGET_DIR/release/app.exe")"
          test -f "$FIVEPM_INSTALLER"
          cd setup/src-tauri
          npx --yes @tauri-apps/cli@2.12.0 build --no-bundle
          cp "$CARGO_TARGET_DIR/release/fivepm-setup.exe" "$GITHUB_WORKSPACE/5pm-Setup-${VER}.exe"

      - name: Attach 5pm Setup to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "5pm-Setup-${GITHUB_REF_NAME#v}.exe" --clobber
