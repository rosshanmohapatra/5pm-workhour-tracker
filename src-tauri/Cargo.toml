[package]
name = "app"
version = "1.2.31"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# Without this, every fivepm:// activation starts a second copy of the app.
# The deep-link feature forwards the URL to the instance already running.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
# The "Update available" toast listens for its own click (shell::notify_update).
# Already in the build through tauri-plugin-notification; same version.
tauri-winrt-notification = "0.8"
# Store build (src/store.rs): package identity, StartupTask, activation kind.
# Same version Tauri already uses, so nothing extra to compile.
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"] }
# Background mode (src/idle.rs): WebView2's memory target while hidden in the tray.
# Same version wry already uses, so nothing extra to compile.
webview2-com = "0.39"
