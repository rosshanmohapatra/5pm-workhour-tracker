<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5pm Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 5pm design system, dark theme tokens (index.html :root .dark) */
  :root {
    --background: #09090b; --foreground: #fafafa; --muted: #18181b; --muted-fg: #a0a0aa;
    --border: #27272b; --track: #27272a; --destructive: #f87171; --success: #4ade80;
    --font: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --radius-md: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #000; font-family: var(--font); color: var(--foreground);
    display: grid; place-items: center; align-content: center; gap: 16px; padding: 16px; }

  /* The setup window. In the real app this fills a 600x300 frameless window. */
  .win { position: relative; width: 100%; max-width: 600px; height: 300px;
    background: var(--background); border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden; }
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; height: 36px; display: flex; justify-content: flex-end; align-items: center;
    padding: 0 6px; gap: 2px; -webkit-app-region: drag; }
  .bar button { -webkit-app-region: no-drag; width: 28px; height: 28px; border: none; border-radius: 6px;
    background: none; color: var(--muted-fg); display: grid; place-items: center; cursor: pointer; }
  .bar button:hover { background: var(--muted); color: var(--foreground); }
  .bar button:disabled { opacity: .3; pointer-events: none; }

  .screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; }
  .screen.on { display: flex; animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* One scale for every screen, taken from the progress screen */
  /* Icon, title and description read as one group (12, 2); the CTA sits apart below it (32). */
  .logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; }
  h1, h2 { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .desc { margin-top: 2px; font-size: 13px; color: var(--muted-fg); line-height: 1.5; white-space: nowrap; }

  .cta { margin-top: 32px; height: 36px; min-width: 140px; padding: 0 24px; border: none;
    border-radius: 4px; background: var(--foreground); color: var(--background);
    font: 600 13px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .cta:hover { opacity: .88; }
  .cta:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; }

  /* Progress screen: logo centred in the space above, progress pinned to the bottom edge */
  #sProgress { justify-content: flex-end; }
  /* Icon pinned to the same spot as on the centred screens (41 + 24 padding + 1 border = 66px from the top). */
  .brand { margin: 41px 0 auto; display: flex; flex-direction: column; align-items: center; }

  .progress { width: 100%; }
  .p-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .p-title { font-size: 15px; font-weight: 600; }
  .p-pct { font-size: 13px; font-weight: 500; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .track { height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 4px; background: var(--foreground); transition: width .2s linear; }
  .p-desc { margin-top: 12px; font-size: 13px; color: var(--muted-fg); text-align: left; }

  .fail h2 { color: var(--foreground); }

  /* Inside the setup app the page is the window: no outer padding or radius
     (Windows 11 rounds the frameless window itself). */
  html.app body { padding: 0; background: var(--background); display: block; }
  html.app .win { max-width: none; height: 100vh; border-radius: 0; }

  /* Review-only controls, not part of the setup window */
  .review { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .review button { background: #18181b; color: #a0a0aa; border: 1px solid #27272b; border-radius: 8px;
    font: 500 12px var(--font); padding: 6px 10px; cursor: pointer; }
  .review button.on { color: #fafafa; border-color: #52525b; }
</style>
</head>
<body>

<div class="win" role="dialog" aria-label="5pm Setup">
  <div class="bar">
    <button type="button" aria-label="Minimize" onclick="win('minimize')">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="closeBtn" aria-label="Close" onclick="win('close')">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 1. Welcome -->
  <section class="screen on" id="sWelcome">
    <img class="logo" src="LOGO" alt="">
    <h1>5pm</h1>
    <p class="desc">Track working hours seamlessly</p>
    <button type="button" class="cta" onclick="start()">Install</button>
  </section>

  <!-- 2. Installing / Updating -->
  <section class="screen" id="sProgress">
    <div class="brand">
      <img class="logo" src="LOGO" alt="">
      <h2>5pm</h2>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pBar">
      <div class="p-head">
        <span class="p-title" id="pTitle">Installing</span>
        <span class="p-pct" id="pPct">0%</span>
      </div>
      <div class="track"><div class="fill" id="pFill"></div></div>
      <p class="p-desc" id="pDesc">Unpacking</p>
    </div>
  </section>

  <!-- 3. Finished (success or failure) -->
  <section class="screen" id="sDone">
    <img class="logo" src="LOGO" alt="">
    <h2 id="dTitle">Installed Successfully</h2>
    <p class="desc" id="dDesc">Begin to track your work hours.</p>
    <button type="button" class="cta" id="dCta" onclick="launch()">Launch</button>
  </section>
</div>

<div class="review" id="review">
  <button type="button" data-s="welcome" class="on">Welcome</button>
  <button type="button" data-s="install">Installing</button>
  <button type="button" data-s="update">Updating</button>
  <button type="button" data-s="ok">Installed</button>
  <button type="button" data-s="okUpd">Updated</button>
  <button type="button" data-s="fail">Install Failed</button>
  <button type="button" data-s="failUpd">Update Failed</button>
</div>

  // isUpdate: set by the setup app when 5pm is already installed.
  let isUpdate = false, timer = null;
  const $ = id => document.getElementById(id);
  document.querySelectorAll('img[src="LOGO"]').forEach(i => i.src = LOGO);
  const COPY = {
    install: { busy: 'Installing', ok: 'Installed Successfully', fail: 'Install Failed',
      okDesc: 'Begin to track your work hours.' },
    update:  { busy: 'Updating',   ok: 'Updated Successfully',   fail: 'Update Failed',
      okDesc: 'Begin to track your work hours.' },
  };
  // The three real phases of the setup app. Rust reports which one it is in:
  //   unpack: extracting the bundled installer
  //   copy:   the installer writing 5pm to disk (progress = bytes written / expected)
  //   finish: shortcuts, registry, waiting for the installer to exit
  const STAGES = { unpack: 'Unpacking', copy: 'Copying', finish: 'Finishing up' };
  const FAIL_DESC = "Something isn't right. Please try again.";

  function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
  function setProgress(pct, desc) {
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    $('pFill').style.width = pct + '%';
    $('pPct').textContent = pct + '%';
    $('pBar').setAttribute('aria-valuenow', pct);
    if (desc) $('pDesc').textContent = desc;
  }
  function progressScreen() {
    $('pTitle').textContent = COPY[isUpdate ? 'update' : 'install'].busy;
    setProgress(0, STAGES.unpack);
    $('closeBtn').disabled = true;  // no closing halfway through
    show('sProgress');
  }
  function done(ok) {
    clearInterval(timer);
    const c = COPY[isUpdate ? 'update' : 'install'];
    $('dTitle').textContent = ok ? c.ok : c.fail;
    $('dDesc').textContent  = ok ? c.okDesc : FAIL_DESC;
    $('dCta').textContent   = ok ? 'Launch' : 'Retry';
    $('dCta').onclick       = ok ? launch : start;
    $('closeBtn').disabled = false;
    show('sDone');
  }

  // Prototype only: fakes the install. The real app drives setProgress/done from Rust.
  function start() {
    progressScreen();
    let p = 0;
    timer = setInterval(() => {
      p += 3 + Math.random() * 5;
      setProgress(p, STAGES[p < 15 ? 'unpack' : p < 90 ? 'copy' : 'finish']);
      if (p >= 100) { setProgress(100); setTimeout(() => done(true), 350); clearInterval(timer); }
    }, 120);
  }
  function launch() {}
  function win() {}

  // Inside the setup app: real install, real progress, real window controls.
  const T = window.__TAURI__;
  if (T) {
    document.documentElement.classList.add('app');
    $('review').remove();
    document.querySelector('.bar').setAttribute('data-tauri-drag-region', '');
    const w = T.window.getCurrentWindow();
    win = action => action === 'minimize' ? w.minimize() : w.close();
    launch = () => T.core.invoke('setup_launch');
    start = () => { progressScreen(); T.core.invoke('setup_install'); };
    T.event.listen('setup://progress', e => setProgress(e.payload.pct, STAGES[e.payload.stage]));
    T.event.listen('setup://done', e => {
      if (e.payload) { setProgress(100); setTimeout(() => done(true), 350); } else done(false);
    });
    T.core.invoke('setup_info').then(v => { isUpdate = !!v; });
  }

  // Review switcher (browser preview only)
  $('review')?.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#review button').forEach(x => x.classList.toggle('on', x === b));
    clearInterval(timer); $('closeBtn').disabled = false;
    const s = b.dataset.s;
    isUpdate = /upd|Upd/.test(s) || s === 'update';
    if (s === 'welcome') show('sWelcome');
    else if (s === 'install' || s === 'update') { progressScreen(); setProgress(54, STAGES.copy); }
    else done(s === 'ok' || s === 'okUpd');
  });
</script>
