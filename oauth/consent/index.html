<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>5pm — Signing in…</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f5f5f7;
      --fg:      #09090b;
      --muted-fg:#71717a;
      --font:    'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .dark {
      --bg:      #09090b;
      --fg:      #fafafa;
      --muted-fg:#a1a1aa;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(113,113,122,.2);
      border-top-color: var(--fg);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .msg  { font-size: 15px; color: var(--muted-fg); }
    .err  { font-size: 14px; color: #dc2626; text-align: center; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg"     id="msg">Completing sign-in…</div>

  <script>
    // Apply saved theme before first paint to avoid flash
    (function () {
      const saved = localStorage.getItem('wh_theme');
      const dark  = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
      if (dark) {
        document.documentElement.classList.add('dark');
        document.getElementById('favicon').href = '/favicon-dark.svg';
      }
    })();

    // ── Supabase config (anon / publishable key — safe in browser) ──────────
    const SUPABASE_URL      = 'https://ivgathdwiptuymrqzruq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2Z2F0aGR3aXB0dXltcnF6cnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODkzMjYsImV4cCI6MjA5NDk2NTMyNn0.cp30eXfoqrESRRzInQLcoierU-Qup4HNAHxPsu21aJ8';
    const SDK_CDN           = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';

    function showError(text) {
      document.getElementById('spinner').style.display = 'none';
      const el = document.getElementById('msg');
      el.className  = 'err';
      el.textContent = text;
      // Redirect back to login after a short pause so the user sees the message
      setTimeout(() => {
        window.location.replace('/login.html?error=oauth_failed');
      }, 3000);
    }

    async function main() {
      // Supabase appends the auth code as ?code= to this page's URL
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');

      // Provider may also return an error instead of a code
      if (!code) {
        const errDesc = params.get('error_description') || params.get('error');
        showError(errDesc ? decodeURIComponent(errDesc) : 'Sign-in was cancelled.');
        return;
      }

      // Dynamically load the Supabase JS SDK (no build step required)
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src    = SDK_CDN;
        script.onload  = resolve;
        script.onerror = () => reject(new Error('Failed to load Supabase SDK'));
        document.head.appendChild(script);
      });

      // Initialise client — detectSessionInUrl:false because we handle it manually
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession:     true,
          autoRefreshToken:   true,
          detectSessionInUrl: false,
        },
      });

      // Exchange the PKCE authorisation code for a real session
      const { data, error } = await supabase.auth.exchangeCodeForSession(code);

      if (error || !data?.session) {
        console.error('[oauth/consent] exchangeCodeForSession failed:', error);
        showError('Sign-in failed. Sending you back to the login page…');
        return;
      }

      // Mark authenticated for the fast synchronous gate in index.html
      localStorage.setItem('wh_auth', '1');

      // All good — go to the app
      window.location.replace('/');
    }

    main().catch(err => {
      console.error('[oauth/consent] Unexpected error:', err);
      showError('Something went wrong. Redirecting…');
    });
  </script>
</body>
</html>
