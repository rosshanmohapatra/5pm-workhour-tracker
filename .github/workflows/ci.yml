name: CI

# Re-runs every check on GitHub for each push (the local Git hooks can be skipped; this can't).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0 # Git hooks aren't needed on the CI machine

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npx prettier --check .
      - name: Lint (ESLint)
        run: npx eslint .
      - name: Unit tests
        run: npm test
      - name: No inline scripts (CSP)
        run: node scripts/check-csp.js
      - name: Known vulnerable dependencies
        run: npm audit --audit-level=high

  # Static security scan (OWASP Top 10 rules). Vendored libraries are skipped.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.184.0
      - name: Semgrep (OWASP Top 10)
        run: >
          semgrep scan --config p/owasp-top-ten --metrics=off --error
          --exclude public/lib/supabase.umd.js --exclude public/lib/driver.js
          --exclude public/lib/floating-ui.js --exclude public/lib/use-gesture.js
          --exclude public/lib/number-flow.js --exclude public/lib/sentry.min.js

  browser-tests:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Playwright)
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
