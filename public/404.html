<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><script src="/lib/csp-handlers.js"></script><script src="/lib/pages/login-handlers.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>5pm — Page not found</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg">
  <meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" data-on-load="he403411552"><noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <!-- Same theme rule as the sign-in page: the saved 5pm theme, else the device. -->
  <script src="/lib/pages/login-inline.js"></script>
  <style>
    /* 404 (#8 design): the sign-in page's card with one way out. */
    :root { --background:#08090c; --surface:#13151a; --foreground:#eef1f6; --text-secondary:#a9b0bd; --text-muted:#828a98; --border:#22262f; --border-subtle:#1a1d24; color-scheme: dark; }
    :root[data-theme="light"] { --background:#eef0f4; --surface:#ffffff; --foreground:#0c0e13; --text-secondary:#545b69; --text-muted:#747c8a; --border:#dde1e8; --border-subtle:#e7eaf0; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 64px 1fr 64px; background: var(--background); color: var(--foreground);
      font: 400 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
    header { display: flex; align-items: center; padding: 0 20px; }
    .mark { width: 28px; height: 28px; border-radius: 8px; display: block; }
    .mark.l { display: none; } :root[data-theme="light"] .mark.d { display: none; } :root[data-theme="light"] .mark.l { display: block; }
    main { display: grid; place-items: center; padding: 20px 16px; }
    .card { width: min(100%, 420px); padding: 24px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .18); }
    .nf { margin: 0 0 8px; font: 400 4rem/1 "Geist", "Inter", system-ui, sans-serif; letter-spacing: -.04em; color: var(--text-muted); }
    h1 { margin: 0; font: 400 1.75rem/1.1 "Geist", "Inter", system-ui, sans-serif; letter-spacing: -.03em; }
    p { margin: 8px 0 20px; color: var(--text-secondary); }
    .btn { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 16px; background: var(--foreground); color: var(--background);
      font-weight: 500; text-decoration: none; transition: opacity .15s; }
    .btn:hover { opacity: .91; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--foreground); }
  </style>
</head>
<body>
  <header><img class="mark d" alt="5pm" src="/icons/brand-dark.svg"><img class="mark l" alt="5pm" src="/icons/brand-light.svg"></header>
  <main>
    <div class="card">
      <p class="nf" aria-hidden="true">404</p>
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped.</p>
      <a class="btn" href="/">Go to 5pm</a>
    </div>
  </main>
  <footer></footer>
</body>
</html>
